name: Upload Mini-Program

on:
  push:
    branches: [develop]
    paths:
      - 'mini-program/**'
      - '.github/workflows/upload-miniprogram.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '体验版版本号 (e.g. 1.0.1)'
        required: false
        default: '1.0.0'
      desc:
        description: '体验版描述'
        required: false
        default: 'auto upload via GH Actions'

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mini-program/package-lock.json

      - name: Install miniprogram-ci
        working-directory: mini-program
        run: npm ci

      - name: Decode code upload key
        run: |
          echo "${{ secrets.WX_MINIPROGRAM_KEY_BASE64 }}" | base64 -d > /tmp/wx_private.key
          ls -la /tmp/wx_private.key

      - name: Inject runtime config (prod apiBaseUrl)
        # config.js 是 gitignored, CI 仓库无此文件 → 注入带 prod URL 的版本,保证体验版连得到后端
        # 用 secret 覆盖灵活: 默认 https://43.139.176.199:443 (SSH 部署的生产服务器)
        # overwrite=always 允许 rerun 时覆盖; 末尾 cleanup 防泄露 (虽不入仓)
        env:
          API_BASE_URL: ${{ secrets.WX_API_BASE_URL || 'https://43.139.176.199:443' }}
          APP_VERSION: "${{ github.event.inputs.version || format('1.0.{0}', github.run_number) }}"
        run: |
          mkdir -p mini-program/src
          cat > mini-program/src/config.js << EOF
          module.exports = {
            sentryDsnMp: '',
            appVersion: '${APP_VERSION}',
            environment: 'production',
            apiBaseUrl: '${API_BASE_URL}',
          };
          EOF
          echo "--- injected config.js ---"
          cat mini-program/src/config.js

      - name: Upload experience version
        working-directory: mini-program
        env:
          VERSION: "${{ github.event.inputs.version || format('1.0.{0}', github.run_number) }}"
          DESC: "${{ github.event.inputs.desc || format('GH Actions auto upload #{0}', github.run_number) }}"
        run: |
          npx miniprogram-ci upload \
            --pp ./ \
            --pkp /tmp/wx_private.key \
            --appid wx3c0c93a02f5d2356 \
            --uv "$VERSION" \
            --udata "$DESC"

      - name: Cleanup key
        if: always()
        run: rm -f /tmp/wx_private.key

      - name: Cleanup injected config
        # 即使 gitignored, 也清掉以确保下次 rerun 用最新 secret 值
        if: always()
        run: rm -f mini-program/src/config.js

      - name: Summary
        if: success()
        run: |
          echo "## Mini-Program Upload" >> $GITHUB_STEP_SUMMARY
          echo "- Version: \`${{ env.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY