name: Emergency Deploy (One-Shot Prod Fix)

# 不用 SSH 也不用手动 git pull — 网页「Run workflow」一键跑完
# 配套脚本: backend/scripts/one-shot-prod-fix.sh (commit 83b6b52)
#
# 用法:
#   GitHub → Actions → "Emergency Deploy (One-Shot Prod Fix)" → Run workflow →
#     (可选) 输入 MySQL root password → 绿勾跑完
#
# 自动做的事:
#   1. SSH 进 prod server
#   2. git pull main 拉最新脚本
#   3. 跑 one-shot-prod-fix.sh (含 7 phase: env/git/backup/migration/pm2/smoke)
#   4. 输出 PASS/FAIL + summary
#
# 密码方案 (任选):
#   - 工作流页面填 "mysql_password" input (masked, 一次性)
#   - 或 server 上有 ~/.my.cnf
#   - 或环境变量 MYSQL_ROOT_PASSWORD secret (需先在 repo Secrets 配置)

on:
  # 推 main 自动触发 — 用户 0 动手就能跑完整 fix
  # manual 也保留 — 万一自动 trigger 失败可以人工 rerun
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/emergency-deploy.yml'
  workflow_dispatch:
    inputs:
      mysql_password:
        description: 'MySQL root password (留空 = 用 ~/.my.cnf 或 backend/.env 自动读)'
        required: false
        sensitive: true
        default: ''

# 防 race condition: 多个 push 同时跑时排队
concurrency:
  group: prod-fix-emergency
  cancel-in-progress: false

jobs:
  fix:
    name: 一键 fix prod (deploy + migrate + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 关键: createCommitStatus API 需要 statuses:write
    # GH Actions default token 不含此权限 — 不加会 silently fail
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要拉 commit history 来写 commit status

      # Pre-check: 确认 3 个 server-related secrets 都设了 (不泄漏值)
      # 不设的话 SSH step 会 fail 但原因模糊
      - name: Pre-check secrets
        id: check_secrets
        run: |
          echo "SERVER_HOST length: ${#SERVER_HOST}"
          echo "SERVER_USER length: ${#SERVER_USER}"
          echo "SERVER_SSH_KEY length: ${#SERVER_SSH_KEY}"
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "::error::MISSING secrets (one of SERVER_HOST / SERVER_USER / SERVER_SSH_KEY is empty)"
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

      - name: Run one-shot-prod-fix.sh on prod
        # 如果 secrets 缺失, 这个 step 仍跑,但只会失败 + 给清晰信息
        if: steps.check_secrets.outputs.missing != 'true'
        id: ssh_run
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: MYSQL_ROOT_PASSWORD
          command_timeout: 8m
          script: |
            set -uo pipefail

            # ---------- 0. 调试信息 ----------
            echo "::group::Connect to prod"
            echo "host=${{ secrets.SERVER_HOST }}"
            echo "user=${{ secrets.SERVER_USER }}"
            echo "remote=$(hostname -f 2>/dev/null || hostname)"
            date '+%Y-%m-%d %H:%M:%S %Z'
            echo "::endgroup::"

            # ---------- 1. 拉最新代码 ----------
            echo "::group::git pull (拉 backend/scripts/one-shot-prod-fix.sh)"
            cd /opt/resume-app || { echo "❌ cd /opt/resume-app 失败"; exit 1; }
            git remote -v | head -1
            git log -1 --oneline
            # ff-only 防止 server 本地有意外 commit 覆盖远端
            if ! git pull --ff-only origin main 2>&1 | tail -5; then
              echo "⚠ git pull 失败 — 用现有文件继续 (脚本可能不是最新)"
            fi
            echo "after-pull HEAD: $(git rev-parse --short HEAD)"
            echo "::endgroup::"

            # ---------- 2. 脚本存在? ----------
            SCRIPT="backend/scripts/one-shot-prod-fix.sh"
            if [ ! -f "$SCRIPT" ]; then
              echo "❌ $SCRIPT 不存在 — git pull 没拉到位"
              exit 1
            fi

            # ---------- 3. MySQL 密码准备 ----------
            # 优先级: workflow input > GH secret $MYSQL_ROOT_PASSWORD (env) > ~/.my.cnf
            if [ -n "${MYSQL_ROOT_PASSWORD:-}" ]; then
              echo "✓ MySQL 密码来自 workflow input"
            elif [ -f "$HOME/.my.cnf" ]; then
              echo "✓ MySQL 密码来自 ~/.my.cnf"
            else
              echo "❌ MySQL 密码未配置 (设 input 或写 ~/.my.cnf)"
              exit 2
            fi

            # ---------- 4. 跑一键脚本 ----------
            echo "::group::one-shot-prod-fix.sh 开始 (7 phase)"
            bash "$SCRIPT"
            EXIT=$?
            echo "::endgroup::"

            # ---------- 5. 总结到 GH Actions ----------
            echo ""
            echo "## Emergency Deploy Result" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ "$EXIT" -eq 0 ]; then
              echo "✅ **PASS** — 全过" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Deployment is healthy. 你可以现在重启 WeChat IDE 进 5 步流测试。" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ **FAIL** — exit code $EXIT" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "把上面 log 贴给 Claude, 我看具体哪个 phase 失败。" >> "$GITHUB_STEP_SUMMARY"
            fi

            # ---------- 6. 清理 workflow input 痕迹 ----------
            unset MYSQL_ROOT_PASSWORD

            exit $EXIT

      # P2: commit status 反馈 — 让用户从 commit page 看 ✅/❌ (无需翻 GH Actions log)
      - name: Report commit status (with diagnostic hint)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            // 智能诊断: SSH step fail 时根据已知信息给精确 hint
            const sshOk = '${{ steps.ssh_run.conclusion }}' === 'success';
            const sshSkipped = '${{ steps.check_secrets.outputs.missing }}' === 'true';
            let desc;
            let state;
            if (sshOk) {
              state = 'success';
              desc = '✅ prod fix PASS — 5 步流能用';
            } else if (sshSkipped) {
              state = 'failure';
              desc = '❌ GH Actions secret 缺失 (SERVER_HOST/USER/SSH_KEY 任一空)';
            } else {
              state = 'failure';
              desc = '❌ SSH fail。3 步排查: 1) 3 secrets 是否齐 2) server ~/.ssh/authorized_keys 有对应公钥 3) SERVER_HOST 可达';
            }
            try {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: state,
                description: desc,
                context: 'prod-deploy',
              });
            } catch (e) {
              core.warning('commit status write failed: ' + e.message);
            }
