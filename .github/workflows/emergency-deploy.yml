name: Emergency Deploy (One-Shot Prod Fix)

# D4 (2026-07-31): 改成 scp 模式,不再 SSH 进 prod 跑 git pull
# 原版问题: prod 上 origin/main stale + 无 GitHub SSH key,git pull 会 fail
#   (有 warning fallback 但脚本可能不是最新)
# 新版: GH Actions runner checkout → scp one-shot-prod-fix.sh → ssh 跑脚本
#   完全 self-contained,不依赖 prod git state
#
# R132: GitHub Flow — 此 workflow 由 main merge 自动触发 (D4 scp 模式).
#   F1+R131: push trigger 不跑 SSH step (避免无密码 exit 2),
#            手动 Run workflow (workflow_dispatch) 才跑 SSH step 跑 7-phase fix.
#   详见 CONTRIBUTING.md.
#
# 配套脚本: backend/scripts/one-shot-prod-fix.sh
#
# 用法:
#   GitHub → Actions → "Emergency Deploy (One-Shot Prod Fix)" → Run workflow →
#     (可选) 输入 MySQL root password → 绿勾跑完
#
# 自动做的事:
#   1. GH Actions runner checkout (拿最新 one-shot-prod-fix.sh)
#   2. SCP 脚本到 prod /tmp/
#   3. SSH 进 prod 跑 /tmp/one-shot-prod-fix.sh
#      (含 7 phase: env/git/backup/migration/pm2/smoke)
#   4. 输出 PASS/FAIL + commit status 反馈
#
# 密码方案 (任选):
#   - 工作流页面填 "mysql_password" input (masked, 一次性)
#   - 或 server 上有 ~/.my.cnf
#   - 或环境变量 MYSQL_ROOT_PASSWORD secret (需先在 repo Secrets 配置)

on:
  # 推 main 自动触发 — 用户 0 动手就能跑完整 fix
  # manual 也保留 — 万一自动 trigger 失败可以人工 rerun
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/emergency-deploy.yml'
  workflow_dispatch:
    inputs:
      mysql_password:
        description: 'MySQL root password (留空 = 用 ~/.my.cnf 或 backend/.env 自动读)。secret 已自动 mask (workflow input 默认 sensitive)'
        required: false
        type: string
        default: ''

# 防 race condition: 多个 push 同时跑时排队
concurrency:
  group: prod-fix-emergency
  cancel-in-progress: false

jobs:
  fix:
    name: 一键 fix prod (deploy + migrate + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 关键: createCommitStatus API 需要 statuses:write
    # GH Actions default token 不含此权限 — 不加会 silently fail
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要拉 commit history 来写 commit status

      # Pre-check: 确认 3 个 server-related secrets 都设了 (不泄漏值)
      # 不设的话 SSH step 会 fail 但原因模糊
      - name: Pre-check secrets
        id: check_secrets
        run: |
          echo "SERVER_HOST length: ${#SERVER_HOST}"
          echo "SERVER_USER length: ${#SERVER_USER}"
          echo "SERVER_SSH_KEY length: ${#SERVER_SSH_KEY}"
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "::error::MISSING secrets (one of SERVER_HOST / SERVER_USER / SERVER_SSH_KEY is empty)"
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

      # D4: SCP 替代 git pull — 不依赖 prod git state + SSH key
      - name: SCP one-shot-prod-fix.sh to prod
        if: steps.check_secrets.outputs.missing != 'true'
        id: scp_run
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'backend/scripts/one-shot-prod-fix.sh'
          target: '/tmp/'
          command_timeout: '2m'

      # F1 (2026-07-31): SSH step 仅 workflow_dispatch 跑 — push trigger 没 MySQL 密码会 exit 2
      # push trigger 目的 = verify workflow 本身 (Pre-check + SCP),不需要跑 script
      # 手动 trigger 才跑 script (可在 workflow_dispatch input 填 MySQL 密码)
      - name: Run one-shot-prod-fix.sh on prod
        if: github.event_name == 'workflow_dispatch' && steps.check_secrets.outputs.missing != 'true'
        id: ssh_run
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: MYSQL_ROOT_PASSWORD
          command_timeout: 8m
          script: |
            set -uo pipefail

            # ---------- 0. 调试信息 ----------
            echo "::group::Connect to prod"
            echo "host=${{ secrets.SERVER_HOST }}"
            echo "user=${{ secrets.SERVER_USER }}"
            echo "remote=$(hostname -f 2>/dev/null || hostname)"
            date '+%Y-%m-%d %H:%M:%S %Z'
            echo "::endgroup::"

            # ---------- 1. 脚本存在? ----------
            SCRIPT="/tmp/one-shot-prod-fix.sh"
            if [ ! -f "$SCRIPT" ]; then
              echo "❌ $SCRIPT 不存在 — scp step 失败"
              exit 1
            fi
            echo "✓ script size: $(wc -c < $SCRIPT) bytes, sha: $(sha256sum $SCRIPT | cut -d' ' -f1)"

            # ---------- 2. MySQL 密码准备 ----------
            # 优先级: workflow input > GH secret $MYSQL_ROOT_PASSWORD (env) > ~/.my.cnf
            if [ -n "${MYSQL_ROOT_PASSWORD:-}" ]; then
              echo "✓ MySQL 密码来自 workflow input"
            elif [ -f "$HOME/.my.cnf" ]; then
              echo "✓ MySQL 密码来自 ~/.my.cnf"
            else
              echo "❌ MySQL 密码未配置 (设 input 或写 ~/.my.cnf)"
              exit 2
            fi

            # ---------- 3. 跑一键脚本 ----------
            echo "::group::one-shot-prod-fix.sh 开始 (7 phase)"
            bash "$SCRIPT"
            EXIT=$?
            echo "::endgroup::"

            # ---------- 4. 清理上传的脚本 (避免 prod 残留) ----------
            rm -f "$SCRIPT"

            # ---------- 5. 总结到 GH Actions ----------
            echo ""
            echo "## Emergency Deploy Result" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ "$EXIT" -eq 0 ]; then
              echo "✅ **PASS** — 全过" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Deployment is healthy. 你可以现在重启 WeChat IDE 进 5 步流测试。" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ **FAIL** — exit code $EXIT" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "把上面 log 贴给 Claude, 我看具体哪个 phase 失败。" >> "$GITHUB_STEP_SUMMARY"
            fi

            # ---------- 6. 清理 workflow input 痕迹 ----------
            unset MYSQL_ROOT_PASSWORD

            exit $EXIT

      # P2: commit status 反馈 — 让用户从 commit page 看 ✅/❌ (无需翻 GH Actions log)
      # F2 (2026-07-31): 区分 push trigger (skip SSH) vs workflow_dispatch (跑 SSH) vs 各 fail 场景
      - name: Report commit status (with diagnostic hint)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            // 4 个 sub-status + event 区分,精确诊断 fail 原因
            const scpOk = '${{ steps.scp_run.conclusion }}' === 'success';
            const sshOk = '${{ steps.ssh_run.conclusion }}' === 'success';
            const sshConcl = '${{ steps.ssh_run.conclusion }}' || 'unknown';
            const secretsMissing = '${{ steps.check_secrets.outputs.missing }}' === 'true';
            const event = '${{ github.event_name }}';
            let desc;
            let state;
            if (secretsMissing) {
              state = 'failure';
              desc = '❌ GH Actions secret 缺失 (SERVER_HOST/USER/SSH_KEY 任一空)';
            } else if (event === 'push') {
              // push trigger: SSH step 故意 skipped (需 MySQL 密码,只有手动 trigger 才能填)
              // scp OK = workflow self-test PASS
              state = scpOk ? 'success' : 'failure';
              desc = scpOk
                ? '✅ workflow self-test PASS (scp ok, ssh 跳过)。需手动 Run workflow 跑完整 fix'
                : '❌ SCP fail。检查 SERVER_SSH_KEY 跟 prod authorized_keys 配对';
            } else if (sshOk) {
              // workflow_dispatch + ssh ok = 全 PASS
              state = 'success';
              desc = '✅ prod fix PASS — 5 步流能用';
            } else {
              // workflow_dispatch + ssh fail = script 内部 fail
              state = 'failure';
              desc = `❌ SSH script fail (conclusion=${sshConcl})。看 run log`;
            }
            try {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: state,
                description: desc,
                context: 'prod-deploy',
              });
            } catch (e) {
              core.warning('commit status write failed: ' + e.message);
            }
