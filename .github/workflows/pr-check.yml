name: PR Check (Test + Lint)

# R132: GitHub Flow — PR 触发 CI check, 必须绿才能 merge
# on: pull_request 触发, 不限制分支 (PR to develop / main 都跑)

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# 防止同 PR 多个 commit 重复跑
concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  backend-test:
    name: Backend test (node:test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        working-directory: backend
        run: npm ci --omit=dev=false --no-audit --no-fund

      - name: Lint (eslint)
        working-directory: backend
        run: npm run lint || echo "lint warning only — fix before merge"

      - name: Unit test (114 cases)
        working-directory: backend
        env:
          # CI 用 NODE_ENV=test 跳过 rate limit + sse replay
          NODE_ENV: test
        run: npm test -- --test-concurrency=1

  frontend-syntax:
    name: Frontend syntax (mini-program wxml/wxss/js)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Check wxml basic syntax (tag balance)
        run: |
          # 简单 sanity: 每个 wxml <view 必须有 </view> 或 <view ... />
          cd mini-program
          failures=0
          for f in $(find . -name "*.wxml" 2>/dev/null); do
            open=$(grep -o "<view" "$f" | wc -l)
            close=$(grep -o "</view>" "$f" | wc -l)
            if [ "$open" != "$close" ]; then
              echo "❌ $f: <view>=$open vs </view>=$close"
              failures=$((failures+1))
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "::warning::$failures wxml 文件 view 标签不平衡"
          else
            echo "✅ 所有 wxml view 标签平衡"
          fi

      - name: Check js syntax (node --check)
        run: |
          cd mini-program
          failures=0
          for f in $(find . -name "*.js" -not -path "*/node_modules/*" 2>/dev/null); do
            if ! node --check "$f" 2>/dev/null; then
              echo "❌ $f 语法错"
              failures=$((failures+1))
            fi
          done
          if [ "$failures" -gt 0 ]; then
            exit 1
          fi
          echo "✅ 所有 js 文件语法 OK"

  docs-check:
    name: Docs (README + runbook)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
      - name: Verify required docs exist
        run: |
          required="README.md RUNBOOK.md CONTRIBUTING.md"
          missing=0
          for f in $required; do
            if [ ! -f "$f" ]; then
              echo "❌ $f missing"
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            exit 1
          fi
          echo "✅ 必需 docs 都在"

  # F2 风格 commit status: 给 commit page 一个 ✅/❌ indicator
  report-status:
    name: Report status (pr-check)
    if: always()
    needs: [backend-test, frontend-syntax, docs-check]
    runs-on: ubuntu-latest
    steps:
      - name: Report commit status
        uses: actions/github-script@v7
        with:
          script: |
            const testOk = '${{ needs.backend-test.result }}' === 'success';
            const feOk = '${{ needs.frontend-syntax.result }}' === 'success';
            const docOk = '${{ needs.docs-check.result }}' === 'success';
            const allOk = testOk && feOk && docOk;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: allOk ? 'success' : 'failure',
              description: allOk
                ? '✅ PR check PASS (test + lint + docs)'
                : `❌ PR check FAIL (test=${testOk?'OK':'FAIL'} lint=${feOk?'OK':'FAIL'} docs=${docOk?'OK':'FAIL'})`,
              context: 'pr-check',
            });